<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neil Mody-Deshmukh — Mechanical Engineer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ============================================================
   COLOR / TYPE TOKENS — change these to re-theme the whole site
   ============================================================ */
:root{
  --bg:#070911;
  --panel:#10131d;
  --panel-border:#232839;
  --ink:#EDEFF4;
  --ink-soft:#8B93A7;
  --ink-faint:#565D71;
  --sun:#E1560C;
  --p-about:#4FA3E3;
  --p-exp:#52C97B;
  --p-proj:#C77DFF;
  --p-skills:#F2C14E;
  --p-contact:#FF6F91;
  --p-egg:#8B93A7;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  overflow-x:hidden;
}
.mono{ font-family:'JetBrains Mono', monospace; }
button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; }
a{ color:inherit; }

/* ---------- starfield ---------- */
.stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
.stars span{ position:absolute; background:#fff; border-radius:50%; opacity:var(--o, .6); }

/* ---------- top nav ---------- */
.topnav{
  position:fixed;
  top:0; left:0; right:0;
  z-index:30;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 28px;
  background:linear-gradient(to bottom, rgba(7,9,17,.92), rgba(7,9,17,0));
  backdrop-filter:blur(2px);
}
.topnav-name{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.01em; }
.topnav nav{ display:flex; gap:4px; flex-wrap:wrap; }
.topnav nav button{
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  padding:8px 12px;
  border-radius:4px;
  transition:color .15s ease, background .15s ease;
}
.topnav nav button:hover{ color:var(--ink); background:rgba(255,255,255,.06); }

/* ---------- orbit stage (static — no rotation) ---------- */
.stage{
  position:relative;
  z-index:1;
  height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.universe{
  --u:clamp(320px, 92vmin, 760px);
  position:relative;
  width:var(--u);
  height:var(--u);
}

/* sun */
.sun{
  position:absolute;
  top:50%; left:50%;
  width:calc(var(--u) * 0.19);
  height:calc(var(--u) * 0.19);
  min-width:96px; min-height:96px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FF9A5A, var(--sun) 60%, #a83c07 100%);
  box-shadow:0 0 40px 8px rgba(225,86,12,.45), 0 0 90px 24px rgba(225,86,12,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  z-index:5;
  transition:transform .2s ease, box-shadow .2s ease;
}
.sun:hover{ transform:translate(-50%,-50%) scale(1.05); box-shadow:0 0 52px 10px rgba(225,86,12,.55), 0 0 110px 30px rgba(225,86,12,.22); }
.sun-label{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:clamp(11px, 1.6vw, 14px);
  line-height:1.2;
  color:#1a0900;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
}

/* decorative rings — purely visual, do not move */
.ring{
  position:absolute;
  top:50%; left:50%;
  border:1px dashed rgba(255,255,255,.10);
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
.ring-1{ width:38%; height:38%; }
.ring-2{ width:56%; height:56%; }
.ring-3{ width:74%; height:74%; }
.ring-4{ width:92%; height:92%; }
.ring-5{ width:108%; height:108%; }
.ring-6{ width:126%; height:126%; }

/* planets — fixed position: rotate to an angle, push out by a radius, rotate back upright */
.planet{
  position:absolute;
  top:50%; left:50%;
  width:40px; height:40px;
  margin:-20px 0 0 -20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  transform: rotate(var(--angle)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle)));
  transition:width .15s ease, height .15s ease, margin .15s ease, box-shadow .15s ease;
}
.planet:hover{ width:46px; height:46px; margin:-23px 0 0 -23px; }

.planet-about{   --angle:24deg;  --radius:calc(var(--u) * 0.19); background:radial-gradient(circle at 35% 30%, #bfe2fb, var(--p-about) 65%); box-shadow:0 0 14px rgba(79,163,227,.5); }
.planet-exp{     --angle:112deg; --radius:calc(var(--u) * 0.28); background:radial-gradient(circle at 35% 30%, #cdf5da, var(--p-exp) 65%); box-shadow:0 0 14px rgba(82,201,123,.5); }
.planet-proj{    --angle:196deg; --radius:calc(var(--u) * 0.37); background:radial-gradient(circle at 35% 30%, #ecd6ff, var(--p-proj) 65%); box-shadow:0 0 14px rgba(199,125,255,.5); }
.planet-skills{  --angle:255deg; --radius:calc(var(--u) * 0.46); background:radial-gradient(circle at 35% 30%, #fbe9b9, var(--p-skills) 65%); box-shadow:0 0 14px rgba(242,193,78,.5); }
.planet-contact{ --angle:322deg; --radius:calc(var(--u) * 0.54); background:radial-gradient(circle at 35% 30%, #ffd6e0, var(--p-contact) 65%); box-shadow:0 0 14px rgba(255,111,145,.5); }

.planet-tag{
  position:absolute;
  top:100%;
  margin-top:8px;
  left:50%;
  transform:translateX(-50%);
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:10px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-soft);
  white-space:nowrap;
  pointer-events:none;
}
.hint{
  position:absolute;
  bottom:26px;
  left:0; right:0;
  text-align:center;
  z-index:2;
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--ink-faint);
}
.scroll-cue{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  width:1px; height:36px;
  background:linear-gradient(var(--ink-faint), transparent);
}

/* ---------- content sections ---------- */
.section{
  position:relative;
  z-index:1;
  max-width:700px;
  margin:0 auto;
  padding:100px 24px 40px 24px;
  scroll-margin-top:80px;
}
.s-eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:10px; }
.s-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(24px,4vw,32px); margin-bottom:22px; }
.s-body p{ color:var(--ink-soft); font-size:14.5px; line-height:1.7; margin-top:14px; max-width:600px; }
.s-body p:first-child{ margin-top:0; }

.s-links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
.s-links a{
  font-family:'JetBrains Mono', monospace;
  font-size:11.5px;
  letter-spacing:0.04em;
  border:1px solid var(--panel-border);
  padding:10px 16px;
  border-radius:6px;
  text-decoration:none;
  color:var(--ink);
  transition:border-color .15s ease, background .15s ease;
}
.s-links a:hover{ border-color:var(--ink-soft); background:rgba(255,255,255,.04); }

.s-entry{ padding:20px 0; border-top:1px solid var(--panel-border); }
.s-entry:first-child{ border-top:none; padding-top:4px; }
.s-entry-head{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
.s-entry-org{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16.5px; }
.s-entry-role{ font-size:13.5px; margin-top:2px; }
.s-entry-meta{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--ink-faint); text-align:right; white-space:nowrap; }
.s-entry ul{ margin:12px 0 0 0; padding:0; list-style:none; }
.s-entry li{ position:relative; padding-left:14px; margin-top:7px; font-size:14px; color:var(--ink-soft); line-height:1.55; }
.s-entry li::before{ content:"—"; position:absolute; left:0; color:var(--ink-faint); }

.s-proj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:620px){ .s-proj-grid{ grid-template-columns:1fr; } }
.s-proj{ border:1px solid var(--panel-border); border-radius:10px; padding:18px; background:var(--panel); }
.s-proj-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:15.5px; }
.s-proj-tools{ font-family:'JetBrains Mono', monospace; font-size:10.5px; margin-top:5px; }
.s-proj ul{ margin:12px 0 0 0; padding:0; list-style:none; }
.s-proj li{ position:relative; padding-left:14px; margin-top:6px; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
.s-proj li::before{ content:"—"; position:absolute; left:0; color:var(--ink-faint); }

.s-skill-row{ display:flex; gap:14px; padding:14px 0; border-top:1px solid var(--panel-border); flex-wrap:wrap; }
.s-skill-row:first-child{ border-top:none; padding-top:4px; }
.s-skill-label{ font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); min-width:120px; }
.s-skill-value{ font-size:14px; color:var(--ink-soft); flex:1; min-width:200px; }

footer{
  position:relative; z-index:1;
  padding:30px 24px 50px 24px;
  text-align:center;
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px;
  color:var(--ink-faint);
}

@media (max-width:560px){
  .topnav{ flex-direction:column; align-items:flex-start; gap:10px; }
  .topnav nav{ gap:2px; }
}
</style>
</head>
<body>

<div class="stars" id="starsLayer"></div>

<header class="topnav">
  <div class="topnav-name mono">Neil Mody-Deshmukh</div>
  <nav>
    <button data-target="home">Home</button>
    <button data-target="about">About</button>
    <button data-target="experience">Experience</button>
    <button data-target="projects">Projects</button>
    <button data-target="skills">Skills</button>
    <button data-target="contact">Contact</button>
  </nav>
</header>

<div class="stage" id="home">
  <div class="universe">

    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
    <div class="ring ring-5"></div>

    <button class="sun" data-target="home" aria-label="Home">
      <span class="sun-label">Neil<br>Mody-Deshmukh</span>
    </button>

    <button class="planet planet-about" data-target="about" aria-label="About">
      <span class="planet-tag">About</span>
    </button>
    <button class="planet planet-exp" data-target="experience" aria-label="Experience">
      <span class="planet-tag">Experience</span>
    </button>
    <button class="planet planet-proj" data-target="projects" aria-label="Projects">
      <span class="planet-tag">Projects</span>
    </button>
    <button class="planet planet-skills" data-target="skills" aria-label="Skills">
      <span class="planet-tag">Skills</span>
    </button>
    <button class="planet planet-contact" data-target="contact" aria-label="Contact">
      <span class="planet-tag">Contact</span>
    </button>

  </div>
  <p class="hint mono">Click a planet to explore</p>
  <div class="scroll-cue"></div>
</div>

<section class="section" id="about"></section>
<section class="section" id="experience"></section>
<section class="section" id="projects"></section>
<section class="section" id="skills"></section>
<section class="section" id="contact"></section>

<footer>NEIL MODY-DESHMUKH — MECHANICAL ENGINEERING PORTFOLIO</footer>

<script>
/* ================================================================
   EDIT YOUR CONTENT HERE — everything the site shows lives in DATA.
   Change strings/arrays below; the layout code doesn't need to change.
   ================================================================ */
const DATA = {
  about: {
    color: "var(--p-about)",
    eyebrow: "01 · About",
    title: "About Me",
    body: `<p>I'm a mechanical engineering student at UIUC with a minor in computer science, GPA 3.8/4.0, on track to graduate May 2028. I specialize in taking hardware from CAD to a working prototype: GD&amp;T, DFM, tolerance stack-ups, and the manufacturing steps in between.</p>
           <p>Most of my hands-on experience comes from Northrop Grumman, across both hardware and mechanical engineering internships — building test fixtures, modeling chassis-level fit, and releasing production-compliant drawings. I'm also a research assistant at the Laboratory for Advanced Space Systems at Illinois, developing a deployable mechanism for a dual-mode monopropellant CubeSat propulsion system.</p>
           <p>Outside of that, I build independent CAD projects end-to-end and mentor other students as a Career Peer with Engineering Career Services.</p>`
  },
  experience: {
    color: "var(--p-exp)",
    eyebrow: "02 · Experience",
    title: "Experience",
    entries: [
      {
        org: "Northrop Grumman", role: "Hardware Engineering Intern",
        meta: "Rolling Meadows, IL · May–Jul 2026",
        bullets: [
          "Designed a countermeasure product-line testing fixture for wire connections to speed up field repairs",
          "Modeled a 5\" LCD, CCAs, and buttons to eliminate chassis interferences and confirm fit",
          "Mapped 3 wire harnesses for CCA pin connections and released 4 MIL-STD-compliant engineering drawings",
          "Prototyped multiple fixture designs — 3 modules reached production, cutting costs 98%"
        ]
      },
      {
        org: "Northrop Grumman", role: "Mechanical Engineering Intern",
        meta: "Rolling Meadows, IL · May–Jul 2025",
        bullets: [
          "Documented 200+ engineering drawings through MPLM for a design review of a next-gen defense solution",
          "Designed 3 mechanical improvements to structural counterweights on LITENING LA pods using Siemens NX",
          "Reconfigured wire harnesses on a next-gen defense pod, increasing output and cutting mass 7%"
        ]
      },
      {
        org: "Laboratory for Advanced Space Systems at Illinois", role: "Undergraduate Research Assistant",
        meta: "Champaign, IL · Sep 2025–May 2026",
        bullets: [
          "Developing a deployable mechanism for the first dual-mode monopropellant CubeSat propulsion system",
          "Designed a burn-wire mechanism in NX after a trade study across 7 quantitative metrics",
          "Presented research poster to faculty and staff — won Audience Award for best research poster"
        ]
      },
      {
        org: "Engineering Career Services", role: "Career Peer",
        meta: "Champaign, IL · Feb 2026–Present",
        bullets: [
          "Mentors students on resume review, job networking and applying, and interview prep",
          "Reviews 30+ resumes and 2–3 mock interviews weekly, contributing to 10+ internship offers"
        ]
      }
    ]
  },
  projects: {
    color: "var(--p-proj)",
    eyebrow: "03 · Projects",
    title: "Projects",
    items: [
      {
        title: "Delivery Robotic Walker", tools: "FUSION 360 · 3D PRINTING · GD&T",
        bullets: [
          "Parallel-linkage legs for 3 terrains, plus a Geneva-wheel mechanism to pick and drop payload",
          "4-bar linkage simulations in PMKS with PVA and DFA analysis",
          "Built via 3D printing, laser cutting, and CNC machining with custom-toleranced pins"
        ]
      },
      {
        title: "Detachable Desk Lamp", tools: "FUSION 360 · TOLERANCE STACK-UP",
        bullets: [
          "15-part assembly with exploded views and GD&T drawings for cast/injection-molded parts",
          "Applied ISO tolerance fits to a button-housing interface for reliable, manufacturable clearance",
          "DFM and material analysis cut unit cost from $60 to $23.85"
        ]
      },
      {
        title: "Hanging Shoebox Shelf", tools: "FUSION 360 · PROTOTYPING",
        bullets: [
          "Compared 10 shelf concepts and selected the best via decision matrix",
          "15-part wall-mounted shelf supporting 10+ lb, with full engineering drawings",
          "Simplified the mounting system through prototyping to improve stability and DFA efficiency"
        ]
      }
    ]
  },
  skills: {
    color: "var(--p-skills)",
    eyebrow: "04 · Skills",
    title: "Skills",
    groups: [
      { label: "Methods", value: "3D Printing, GD&T, DFM, DFA, PVA, Injection Molding, CNC Machining, Prototyping" },
      { label: "CAD & CAE", value: "Siemens NX, Fusion 360, Creo, ANSYS, AutoCAD, CATIA, MPLM" },
      { label: "Programming", value: "Python, Java, MATLAB, Simulink, NumPy, SymPy, aPriori" }
    ]
  },
  contact: {
    color: "var(--p-contact)",
    eyebrow: "05 · Contact",
    title: "Get In Touch",
    body: `<p>I'd love to hear from you — reach out through any of the links below.</p>`,
    links: [
      { label: "Email", href: "mailto:neilmd.2006@gmail.com" },
      { label: "LinkedIn", href: "https://linkedin.com/in/neil-mody-deshmukh" },
      { label: "Resume", href: "Neil_Mody-Deshmukh_Resume.pdf" }
    ]
  }
};
/* ================================================================
   End of editable content.
   ================================================================ */

// ---------- starfield ----------
(function makeStars(){
  const layer = document.getElementById('starsLayer');
  const frag = document.createDocumentFragment();
  const count = window.innerWidth < 600 ? 90 : 160;
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    const size = Math.random() < 0.85 ? 1 : 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.setProperty('--o', (Math.random()*0.6 + 0.25).toFixed(2));
    frag.appendChild(s);
  }
  layer.appendChild(frag);
})();

// ---------- render sections from DATA ----------
function renderSection(key){
  const d = DATA[key];
  const el = document.getElementById(key);
  if(!d || !el) return;

  let html = `<div class="s-eyebrow" style="color:${d.color}">${d.eyebrow}</div>
              <div class="s-title">${d.title}</div>`;

  if(d.body) html += `<div class="s-body">${d.body}</div>`;

  if(d.entries){
    d.entries.forEach(e => {
      html += `<div class="s-entry">
        <div class="s-entry-head">
          <div><div class="s-entry-org">${e.org}</div><div class="s-entry-role" style="color:${d.color}">${e.role}</div></div>
          <div class="s-entry-meta mono">${e.meta}</div>
        </div>
        <ul>${e.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    });
  }

  if(d.items){
    html += `<div class="s-proj-grid">`;
    d.items.forEach(p => {
      html += `<div class="s-proj">
        <div class="s-proj-title">${p.title}</div>
        <div class="s-proj-tools mono" style="color:${d.color}">${p.tools}</div>
        <ul>${p.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    });
    html += `</div>`;
  }

  if(d.groups){
    d.groups.forEach(g => {
      html += `<div class="s-skill-row">
        <div class="s-skill-label">${g.label}</div>
        <div class="s-skill-value">${g.value}</div>
      </div>`;
    });
  }

  if(d.links && d.links.length){
    html += `<div class="s-links">${d.links.map(l => `<a href="${l.href}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</div>`;
  }

  el.innerHTML = html;
}

['about','experience','projects','skills','contact'].forEach(renderSection);

// ---------- click a planet or nav item -> scroll to section ----------
document.querySelectorAll('[data-target]').forEach(el => {
  el.addEventListener('click', () => {
    const target = document.getElementById(el.dataset.target);
    if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
  });
});
</script>

</body>
</html>
